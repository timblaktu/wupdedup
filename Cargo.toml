[package]
name = "wupdedup-rs"
version = "0.1.0"
edition = "2021"
authors = ["Tim Blaktu"]
description = "A modular multicloud storage management and deduplication tool"
license = "MIT"
repository = "https://github.com/timblaktu/wupdedup"

[dependencies]
# Core dependencies
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0"

# Database
redb = "2.2"

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"

# File operations
walkdir = "2.5"
rayon = "1.10"
blake3 = "1.5"
infer = "0.16"

# Cloud storage
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
backoff = "0.4"

# Perceptual hashing for images
image = "0.25"
image_hasher = "2.0"

# Content-defined chunking
fastcdc = "3.1"

# Utilities
chrono = "0.4"
bytes = "1.8"
futures = "0.3"
url = "2.5"

[dev-dependencies]
tempfile = "3.14"
pretty_assertions = "1.4"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
