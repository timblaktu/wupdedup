[package]
name = "wupdedup"
version = "0.1.0"
edition = "2021"
authors = ["Tim Blaktu"]
description = "A modular multicloud storage management and deduplication tool"
license = "MIT"
repository = "https://github.com/timblaktu/wupdedup"

# Lint configuration - treat warnings as errors in CI
[lints.rust]
warnings = "deny"
dead_code = "warn"  # Allow dead_code during development with explicit #[allow()]
unused_imports = "deny"
unused_variables = "deny"

[dependencies]
# Core dependencies
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0"

# Database
redb = "2.2"

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"

# File operations
walkdir = "2.5"
rayon = "1.10"
blake3 = "1.5"
infer = "0.16"

# Cloud storage
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
backoff = "0.4"
smugmug = "0.6"

# Perceptual hashing for images
image = "0.25"
image_hasher = "2.0"

# Content-defined chunking
fastcdc = "3.1"

# Utilities
chrono = "0.4"
bytes = "1.8"
futures = "0.3"
url = "2.5"

[dev-dependencies]
tempfile = "3.14"
pretty_assertions = "1.4"
criterion = "0.5"
proptest = "1.5"
rstest = "0.23"
rstest_reuse = "0.7"
mockall = "0.13"
serial_test = "3.1"
once_cell = "1.20"
test-case = "3.1"
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[[bench]]
name = "hash_benchmark"
harness = false

[[bench]]
name = "db_benchmark"
harness = false
